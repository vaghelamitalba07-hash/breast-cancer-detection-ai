<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pink Ribbon Logo</title>

<style>

body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
    background:linear-gradient(135deg,#fff0f5,#ffe6f0);
    font-family:'Poppins',sans-serif;
}

.logo{
    position:relative;
    width:220px;
    height:260px;
}

.head{
    position:absolute;
    top:0;
    left:50%;
    transform:translateX(-50%);
    width:55px;
    height:70px;
    border:5px solid #e91e63;
    border-radius:50%;
    background:transparent;
}

.body{
    position:absolute;
    top:30px;
    left:0;
    width:100%;
    height:230px;
}

svg{
    width:100%;
    height:100%;
}

.arms{
    fill:none;
    stroke:#e91e63;
    stroke-width:5;
    stroke-linecap:round;
}

.ribbon{
    fill:url(#grad);
}

</style>
</head>

<body>

<div class="logo">

    <div class="head"></div>

    <div class="body">

        <svg viewBox="0 0 200 260">

            <defs>
                <linearGradient id="grad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#ff5aa9"/>
                    <stop offset="100%" stop-color="#e91e63"/>
                </linearGradient>
            </defs>

            <!-- Arms -->
            <path class="arms"
                d="M20 70
                   Q100 20 100 90

                   M180 70
                   Q100 20 100 90" />

            <!-- Ribbon -->
            <path class="ribbon"
                d="M100 90
                   C70 90 50 120 50 150
                   C50 190 80 220 100 245
                   C120 220 150 190 150 150
                   C150 120 130 90 100 90

                   M100 120
                   C85 120 70 140 70 155
                   L100 185
                   L130 155
                   C130 140 115 120 100 120Z" />

        </svg>

    </div>

</div>

</body>
</html>