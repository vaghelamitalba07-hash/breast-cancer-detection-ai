<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | OncoSense AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(145deg, #fff9f5 0%, #ffeef4 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-box {
            background: white;
            border-radius: 1.5rem;
            padding: 2rem;
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(232,58,107,0.2);
            box-shadow: 0 20px 40px rgba(0,0,0,0.05);
            text-align: center;
        }
        .login-box img { width: 60px; border-radius: 50%; margin-bottom: 1rem; }
        .login-box h2 { color: #2a1a2e; margin-bottom: 0.5rem; }
        .login-box p { color: #6b4c60; margin-bottom: 1.5rem; }
        .login-box input {
            width: 100%;
            padding: 0.75rem;
            margin: 0.5rem 0;
            background: #f5f0f2;
            border: 1px solid #e8d5df;
            border-radius: 0.5rem;
        }
        .login-box button {
            width: 100%;
            padding: 0.75rem;
            background: linear-gradient(135deg, #e83a6b, #b03b8b);
            border: none;
            border-radius: 0.5rem;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        .error { color: #ef4444; margin-top: 0.5rem; font-size: 0.8rem; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="login-box">
        <img src="/images/logo.png" alt="OncoSense AI">
        <h2>OncoSense AI</h2>
        <p>Sign in to access dashboard</p>
        <input type="text" id="username" placeholder="Username" value="demo">
        <input type="password" id="password" placeholder="Password" value="demo123">
        <div id="error" class="error hidden"></div>
        <button onclick="login()">Sign In</button>
    </div>
    <script>
        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error');
            errorDiv.classList.add('hidden');
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('username', data.username);
                    window.location.href = '/dashboard';
                } else {
                    errorDiv.textContent = data.detail || 'Login failed';
                    errorDiv.classList.remove('hidden');
                }
            } catch(err) {
                errorDiv.textContent = 'Connection error';
                errorDiv.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
